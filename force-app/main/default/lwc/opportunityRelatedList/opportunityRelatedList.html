<template>
    <lightning-card title="Opportunities" icon-name="standard:opportunity">
        <lightning-button
            slot="actions"
            label="New"
            onclick={handleNewClick}>
        </lightning-button>

        <lightning-datatable
            key-field="Id"
            data={opportunities}
            columns={columns}
            hide-checkbox-column>
        </lightning-datatable>
x
        <template lwc:if={isModalOpen}>
            <section class="slds-modal slds-fade-in-open" role="dialog">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">New Opportunity</h2>
                    </header>
                    <div class="slds-modal__content slds-var-p-around_medium">
                        <lightning-record-edit-form
                            object-api-name="Opportunity"
                            onsuccess={handleSuccess}
                            onerror={handleError}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field field-name="Name"></lightning-input-field>
                            <lightning-input-field field-name="AccountId" value={recordId} disabled></lightning-input-field>
                            <lightning-input-field field-name="StageName"></lightning-input-field>
                            <lightning-input-field field-name="CloseDate"></lightning-input-field>
                            <lightning-input-field field-name="Amount"></lightning-input-field>

                            <div class="slds-modal__footer slds-var-m-top_medium">
                                <lightning-button
                                    label="Cancel"
                                    onclick={handleCancel}
                                    class="slds-var-m-right_x-small">
                                </lightning-button>
                                <lightning-button
                                    variant="brand"
                                    type="submit"
                                    label="Save">
                                </lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
